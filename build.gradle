plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'com.gradleup.shadow' version '9.2.2'
    id 'java'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.lavalink.dev/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // 26.1以降のMinecraftは難読化されていないため、mappingsの指定は不要（指定するとエラーになる）

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // YouTube解析ライブラリ（ビルド時にjar内へ丸ごと埋め込み）
    implementation 'dev.arbjerg:lavaplayer:2.2.1'
    shadow 'dev.arbjerg:lavaplayer:2.2.1'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Java 25 向けコンパイル設定（Minecraft 26.2はJava 25必須）
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

// 外部ライブラリを1つのjarに固める処理
// 26.1以降はリマップ処理自体が不要になったため、shadowJarの出力がそのまま最終成果物
shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier.set('')
}

build {
    dependsOn shadowJar
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
