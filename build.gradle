buildscript {
    repositories {
        mavenCentral()
        maven { url 'https://maven.fabricmc.net/' }
    }
    dependencies {
        // Loom内部のASMを Java 25 (Class file 69) 対応の最新版に強制差し替え
        classpath 'org.ow2.asm:asm:9.7'
        classpath 'org.ow2.asm:asm-commons:9.7'
        classpath 'net.fabricmc:fabric-loom:1.9-SNAPSHOT'
    }
}

apply plugin: 'net.fabricmc.loom'
apply plugin: 'com.github.johnrengelman.shadow'

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url 'https://maven.lavalink.dev/releases' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // YouTube解析ライブラリ（ビルド時にjar内へ丸ごと埋め込み）
    implementation 'dev.arbjerg:lavaplayer:2.2.1'
    shadow 'dev.arbjerg:lavaplayer:2.2.1'
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

// Java 25 向けコンパイル設定
tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

// 外部ライブラリを1つのjarに固める処理
shadowJar {
    configurations = [project.configurations.shadow]
    archiveClassifier.set('all')
}

remapJar {
    dependsOn shadowJar
    inputFile = shadowJar.archiveFile
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}
